name: Gate 13 D-K-structure preflight

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/gate13_dks_preflight.yml"
      - "experiments/gate13_dks_preflight.py"
      - "experiments/gate13_dks_exchange_surface.py"
      - "docs/GATE13_PREREG_DKS_EXCHANGE_SURFACE.md"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e .
      - run: python -m py_compile experiments/gate13_dks_preflight.py experiments/gate13_dks_exchange_surface.py
      - run: python experiments/gate13_dks_preflight.py
      - run: python experiments/gate13_dks_exchange_surface.py --smoke --world-seed 13100 --output gate13_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate13-smoke
          path: gate13_smoke.json
