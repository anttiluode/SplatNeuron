name: MNIST scale gate

on:
  push:
    branches: ["agent/route-grow"]
    paths:
      - ".github/workflows/mnist_scale.yml"
      - "experiments/gate10_mnist_scale_v2.py"
      - "pyproject.toml"

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python -m pip install -e . scikit-learn
      - run: python experiments/gate10_mnist_scale_v2.py --download --one-seed
