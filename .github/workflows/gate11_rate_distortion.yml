name: Gate 11 map rate-distortion

on:
  push:
    branches: ["agent/route-grow"]
    paths:
      - ".github/workflows/gate11_rate_distortion.yml"
      - "experiments/gate11_map_rate_distortion.py"
      - "docs/GATE11_PREREG_RATE_DISTORTION.md"

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -e . scikit-learn
      - run: python experiments/gate11_map_rate_distortion.py --full
