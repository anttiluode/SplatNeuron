name: MNIST compact-map attackers

on:
  push:
    branches: ["agent/route-grow"]
    paths:
      - ".github/workflows/mnist_compact_attack.yml"
      - "experiments/gate10c_gaussian_derivative.py"

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python -m pip install -e . scikit-learn
      - run: python experiments/gate10c_gaussian_derivative.py --download
