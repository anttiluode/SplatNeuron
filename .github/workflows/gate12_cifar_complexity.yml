name: Gate 12 CIFAR observer complexity

on:
  push:
    branches: ["agent/route-grow"]
    paths:
      - ".github/workflows/gate12_cifar_complexity.yml"
      - "experiments/gate12_cifar_complexity_rate.py"
      - "docs/GATE12_PREREG_CIFAR_COMPLEXITY.md"

jobs:
  cifar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: python -m pip install -e . scikit-learn
      - run: python -m py_compile experiments/gate12_cifar_complexity_rate.py
      - run: python experiments/gate12_cifar_complexity_rate.py --download
